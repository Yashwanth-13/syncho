[package]
name = "syncho"
rust-version = "1.88"
version = "0.1.0"
edition = "2024"

[dependencies]
cider-api = "0.1.1"
dialoguer = "0.12.0"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"]}
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
rand = "0.10.2"
strsim = "0.11.1"
mini_async_repl = "0.2.1"
anyhow = "1.0.104"
base64 = "0.23.1"
unicode-normalization = "0.1.25"
nowhear = "0.5.2"
futures = "0.3.34"
